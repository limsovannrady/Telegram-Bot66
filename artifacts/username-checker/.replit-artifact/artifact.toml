kind = "web"
previewPath = "/"
title = "Telegram Username Checker"
version = "1.0.0"
id = "artifacts/username-checker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19396

[services.development]
run = "pnpm --filter @workspace/username-checker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/username-checker", "run", "build" ]
publicDir = "artifacts/username-checker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19396"
BASE_PATH = "/"
